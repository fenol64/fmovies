services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fmovies
      POSTGRES_PASSWORD: fmovies
      POSTGRES_DB: fmovies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmovies -d fmovies"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fmovies:fmovies@db:5432/fmovies
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
